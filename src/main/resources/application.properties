
# Keycloak JWT configuration for OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/tourisme
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8090/realms/tourisme/protocol/openid-connect/certs

# Keycloak admin client config for registration (admin operations only)
keycloak.auth-server-url=http://localhost:8090
keycloak.realm=tourisme
keycloak.resource=tour
keycloak.credentials.secret=IJ4Ae7P1LJgzjShl19PNTLPlVpqOVZdW
keycloak.admin.username=admin
keycloak.admin.password=admin

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tourisme?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server configuration
server.port=8080

# CORS logging
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT and OAuth2 logging
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=DEBUG

# CORS configuration
spring.web.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://192.168.*:*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=Origin,Content-Type,Accept,Authorization,X-Requested-With
spring.web.cors.exposed-headers=Authorization,Content-Type
spring.web.cors.allow-credentials=true


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Enable debug logging for Spring and your package
logging.level.org.springframework=DEBUG
logging.level.com.tourisme=DEBUG

# Log SQL queries (if using JPA/Hibernate)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log HTTP requests/responses
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Log to a file (adjust path as needed)
logging.file.name=logs/application.log
logging.file.path=./logs  # Alternative (creates spring.log)